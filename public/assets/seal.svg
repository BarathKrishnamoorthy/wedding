<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Deep Royal Red Wax Gradient -->
    <radialGradient id="waxRed" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#B22222" />
      <stop offset="35%" stop-color="#8B0000" />
      <stop offset="70%" stop-color="#5C0000" />
      <stop offset="100%" stop-color="#360000" />
    </radialGradient>
    
    <!-- Metallic Gold Gradient -->
    <radialGradient id="goldMonogram" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF5C2" />
      <stop offset="25%" stop-color="#E8C766" />
      <stop offset="60%" stop-color="#C59B27" />
      <stop offset="85%" stop-color="#9A7010" />
      <stop offset="100%" stop-color="#5E3F00" />
    </radialGradient>

    <!-- Drop Shadow / Depth Filters -->
    <filter id="waxShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#2a0000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#150000" flood-opacity="0.5"/>
    </filter>

    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="0.5" flood-color="#FFF5C2" flood-opacity="0.7"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="0.5" flood-color="#3A0000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Irregular Organic Wax Seal Outer Shape -->
  <path d="M 100,12 
           C 120,10 135,16 150,26 
           C 165,36 178,50 185,68 
           C 192,86 188,105 186,124 
           C 184,143 174,162 158,174 
           C 142,186 122,192 102,190 
           C 82,188 64,184 48,172 
           C 32,160 20,144 16,126 
           C 12,108 14,88 22,70 
           C 30,52 44,38 60,26 
           C 76,14 88,12 100,12 Z" 
        fill="url(#waxRed)" 
        filter="url(#waxShadow)" />

  <!-- Inner Raised Ridge Ring -->
  <circle cx="100" cy="100" r="74" fill="none" stroke="#7A0000" stroke-width="4" opacity="0.8" />
  <circle cx="100" cy="100" r="72" fill="none" stroke="url(#goldMonogram)" stroke-width="1.8" opacity="0.85" />
  
  <!-- Laurel Wreath & Decorative Dots Ring -->
  <circle cx="100" cy="100" r="65" fill="none" stroke="url(#goldMonogram)" stroke-width="1.2" stroke-dasharray="3, 4" opacity="0.7" />

  <!-- Inner Medallion Center -->
  <circle cx="100" cy="100" r="56" fill="#6B0000" opacity="0.4" />

  <!-- Monogram S & K and Ampersand -->
  <g filter="url(#emboss)">
    <!-- Crown / Royal Crest top -->
    <path d="M 90,62 L 95,68 L 100,58 L 105,68 L 110,62 L 108,72 L 92,72 Z" fill="url(#goldMonogram)" />
    <circle cx="90" cy="60" r="1.5" fill="url(#goldMonogram)" />
    <circle cx="100" cy="56" r="1.8" fill="url(#goldMonogram)" />
    <circle cx="110" cy="60" r="1.5" fill="url(#goldMonogram)" />

    <!-- Siva & Kani Letters -->
    <text x="100" y="116" 
          font-family="'Cinzel Decorative', 'Fraunces', Georgia, serif" 
          font-size="36" 
          font-weight="bold" 
          letter-spacing="2" 
          fill="url(#goldMonogram)" 
          text-anchor="middle">S&amp;K</text>

    <!-- Subtitle Date / Forever text -->
    <text x="100" y="136" 
          font-family="'DM Sans', system-ui, sans-serif" 
          font-size="8.5" 
          font-weight="600" 
          letter-spacing="3" 
          fill="url(#goldMonogram)" 
          opacity="0.9" 
          text-anchor="middle">FOREVER</text>
  </g>

  <!-- Wax Highlight Shine -->
  <ellipse cx="65" cy="45" rx="35" ry="16" transform="rotate(-30 65 45)" fill="#FFFFFF" opacity="0.12" />
</svg>
