<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Deep Royal Crimson Wax Gradient with Rich Dimensional Shading -->
    <radialGradient id="waxRed" cx="36%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#C81E38" />
      <stop offset="28%" stop-color="#9E0E24" />
      <stop offset="65%" stop-color="#6E0515" />
      <stop offset="92%" stop-color="#48020B" />
      <stop offset="100%" stop-color="#280005" />
    </radialGradient>

    <!-- Ultra-Luminous 24K Polished Gold Gradient -->
    <linearGradient id="brightGold" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="18%" stop-color="#FFF6C8" />
      <stop offset="45%" stop-color="#FCD34D" />
      <stop offset="72%" stop-color="#F59E0B" />
      <stop offset="92%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Deep Inset Medallion Red for Ultra High Text Contrast -->
    <radialGradient id="waxInner" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#55020D" />
      <stop offset="75%" stop-color="#380108" />
      <stop offset="100%" stop-color="#1F0004" />
    </radialGradient>

    <!-- Drop Shadows for 3D Seal Outer Base -->
    <filter id="waxShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#180003" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0E0002" flood-opacity="0.6"/>
    </filter>

    <!-- Crisp High-Contrast Text Stamp Relief -->
    <filter id="crispRelief" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="0.6" flood-color="#0F0003" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="-0.5" stdDeviation="0.3" flood-color="#FFF8DC" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Organic Wax Outer Seal Shape with tactile sculpted edges -->
  <path d="M 100,10 
           C 122,8 138,15 153,25 
           C 168,35 180,50 187,68 
           C 194,86 191,105 188,124 
           C 185,143 175,162 160,175 
           C 144,187 124,193 103,191 
           C 82,189 63,184 46,172 
           C 30,160 18,143 14,124 
           C 10,105 12,85 20,67 
           C 28,49 43,35 59,24 
           C 75,13 87,10 100,10 Z" 
        fill="url(#waxRed)" 
        filter="url(#waxShadow)" />

  <!-- Outer Ring Ridge -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#50020B" stroke-width="4.5" opacity="0.9" />
  <circle cx="100" cy="100" r="73" fill="none" stroke="url(#brightGold)" stroke-width="2.2" opacity="0.9" />

  <!-- Beaded Stamped Border Ring -->
  <circle cx="100" cy="100" r="66" fill="none" stroke="url(#brightGold)" stroke-width="1.8" stroke-dasharray="2.5, 4.2" stroke-linecap="round" opacity="0.85" />

  <!-- Inner Recessed Wax Medallion (Darker for maximum gold text contrast) -->
  <circle cx="100" cy="100" r="58" fill="url(#waxInner)" />
  <circle cx="100" cy="100" r="58" fill="none" stroke="#220004" stroke-width="2" opacity="0.8" />

  <!-- Gold Monogram & Text Content -->
  <g filter="url(#crispRelief)">
    <!-- Royal 5-Point Imperial Crown -->
    <path d="M 87,58 L 92,66 L 100,52 L 108,66 L 113,58 L 111,70 L 89,70 Z" fill="url(#brightGold)" />
    <circle cx="87" cy="56" r="1.8" fill="url(#brightGold)" />
    <circle cx="93.5" cy="64" r="1.2" fill="url(#brightGold)" />
    <circle cx="100" cy="50" r="2.2" fill="url(#brightGold)" />
    <circle cx="106.5" cy="64" r="1.2" fill="url(#brightGold)" />
    <circle cx="113" cy="56" r="1.8" fill="url(#brightGold)" />
    <!-- Crown Base Band -->
    <rect x="89" y="70" width="22" height="2.2" rx="1.1" fill="url(#brightGold)" />

    <!-- Siva & Kani Monogram: "S & K" with high legibility and bold presence -->
    <text x="100" y="112" 
          font-family="'Playfair Display', 'Cinzel Decorative', Georgia, serif" 
          font-size="38" 
          font-weight="900" 
          letter-spacing="2.5" 
          fill="url(#brightGold)" 
          text-anchor="middle">S&amp;K</text>

    <!-- Subtitle: "FOREVER" — Extra Clear, High-Contrast, Large, and Distinct -->
    <text x="100" y="133" 
          font-family="'DM Sans', system-ui, -apple-system, sans-serif" 
          font-size="11.5" 
          font-weight="900" 
          letter-spacing="4.5" 
          fill="url(#brightGold)" 
          text-anchor="middle">FOREVER</text>
  </g>

  <!-- Subtle Top-Left Wax Curvature Highlight -->
  <ellipse cx="64" cy="44" rx="36" ry="18" transform="rotate(-32 64 44)" fill="#FFFFFF" opacity="0.16" />
</svg>
